# CV1800B/SG200x on-chip audio (Milk-V Duo family)
#
# The simple-audio-card exposes two PCMs on card 0:
#   device 0 = I2S0 -> internal DAC   (playback only)
#   device 1 = internal ADC -> I2S0   (capture only)
#
# Map the ALSA default so bare `aplay`/`arecord` hit the right device, and
# wrap both in plug so rate/format are converted (the codecs are fixed at
# 48000 Hz / S16_LE / stereo).
pcm.!default {
	type asym
	playback.pcm "plughw:0,0"
	capture.pcm  "plughw:0,1"
}

ctl.!default {
	type hw
	card 0
}
